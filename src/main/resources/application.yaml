spring:
  application:
    name: auth-server
  config:
    import: configserver:http://localhost:8888
  #import: optional:configserver:http://localhost:8888
  cloud:
    config:
      label: v1.0.1
isepat:
  adresse: Diamniadio
management:
  endpoints:
    health:
    web:
      exposure:
        include:
          - health
          - refresh
          - metrics
          - env
          - configprops
  endpoint:
    configprops:
      show-values: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
      #http://localhost:8761 => portail
      #http://localhost:8761/eureka/apps => portail